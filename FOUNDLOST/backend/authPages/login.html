<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --text: #1E1E1C;
    --text-muted: #6B6A63;
    --border: #DEDBD2;
    --accent: #0F6E56;
    --accent-hover: #0B5744;
    --danger: #A32D2D;
    --danger-bg: #FAECE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
  }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin: 0 0 28px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
  .msg.error { display: block; background: var(--danger-bg); color: var(--danger); }
  .footer-link { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 20px; }
  .footer-link a { color: var(--accent); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h1>เข้าสู่ระบบ</h1>
  <p class="subtitle">ยินดีต้อนรับกลับมา</p>
  <div id="login-msg" class="msg"></div>
  <form id="login-form">
    <label for="login-email">อีเมล</label>
    <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com">
    <label for="login-password">รหัสผ่าน</label>
    <input type="password" id="login-password" required autocomplete="current-password" placeholder="รหัสผ่านของคุณ">
    <button type="submit" id="login-submit">เข้าสู่ระบบ</button>
  </form>
  <p class="footer-link">ยังไม่มีบัญชี? <a href="/signup.html">สมัครสมาชิก</a></p>
</div>

<script>
  const API_BASE = '/auth';

  const form = document.getElementById('login-form');
  const msg = document.getElementById('login-msg');
  const submitBtn = document.getElementById('login-submit');

  function showError(text) {
    msg.textContent = text;
    msg.className = 'msg error';
  }
  function clearMsg() {
    msg.textContent = '';
    msg.className = 'msg';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    submitBtn.disabled = true;
    submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';
    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(res.status === 429 ? 'พยายามเข้าสู่ระบบถี่เกินไป กรุณารอสักครู่' : 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        return;
      }
      // Store the JWT — swap for an httpOnly cookie set by the server
      // if you want to avoid keeping the token in localStorage.
      localStorage.setItem('token', data.token);
      window.location.href = '/';
    } catch (err) {
      showError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'เข้าสู่ระบบ';
    }
  });
</script>

</body>
</html>
