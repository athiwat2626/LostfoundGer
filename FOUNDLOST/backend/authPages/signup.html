<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก</title>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --text: #1E1E1C;
    --text-muted: #6B6A63;
    --border: #DEDBD2;
    --accent: #0F6E56;
    --accent-hover: #0B5744;
    --danger: #A32D2D;
    --danger-bg: #FAECE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.5;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 36px 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin: 0 0 6px;
  }
  .step-label {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 28px;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface);
    margin-bottom: 16px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  input.otp-input {
    letter-spacing: 8px;
    font-size: 20px;
    text-align: center;
  }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  button.link {
    background: none;
    color: var(--accent);
    width: auto;
    padding: 0;
    font-size: 13px;
    margin-top: 14px;
  }
  button.link:hover { text-decoration: underline; background: none; }
  button.link:disabled { color: var(--text-muted); background: none; }
  .msg {
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
  .msg.error { display: block; background: var(--danger-bg); color: var(--danger); }
  .msg.info { display: block; background: #E1F5EE; color: #085041; }
  .hint { font-size: 12px; color: var(--text-muted); margin: -10px 0 16px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .success-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: #E1F5EE; color: #085041;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; margin-bottom: 16px;
  }
</style>
</head>
<body>

<div class="card">

  <!-- Step 1: register -->
  <div id="screen-register" class="screen active">
    <h1>สร้างบัญชี</h1>
    <p class="step-label">ขั้นตอนที่ 1 จาก 2 — กรอกอีเมลและรหัสผ่าน</p>
    <div id="register-msg" class="msg"></div>
    <form id="register-form">
      <label for="reg-email">อีเมล</label>
      <input type="email" id="reg-email" required autocomplete="email" placeholder="you@example.com">
      <label for="reg-password">รหัสผ่าน</label>
      <input type="password" id="reg-password" required autocomplete="new-password" minlength="8" placeholder="อย่างน้อย 8 ตัวอักษร">
      <button type="submit" id="register-submit">ส่งรหัสยืนยัน</button>
    </form>
  </div>

  <!-- Step 2: verify OTP -->
  <div id="screen-verify" class="screen">
    <h1>ยืนยันอีเมล</h1>
    <p class="step-label" id="verify-subtitle">ขั้นตอนที่ 2 จาก 2</p>
    <div id="verify-msg" class="msg"></div>
    <form id="verify-form">
      <label for="otp-code">รหัส 6 หลักที่ส่งไปทางอีเมล</label>
      <input type="text" id="otp-code" class="otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="one-time-code" placeholder="000000">
      <div class="hint">รหัสหมดอายุภายใน 5 นาที</div>
      <button type="submit" id="verify-submit">ยืนยัน</button>
    </form>
    <button type="button" class="link" id="resend-btn">ส่งรหัสอีกครั้ง</button>
  </div>

  <!-- Step 3: success -->
  <div id="screen-success" class="screen">
    <div class="success-icon">&#10003;</div>
    <h1>สมัครสมาชิกสำเร็จ</h1>
    <p class="step-label" style="margin-bottom:24px">บัญชีของคุณพร้อมใช้งานแล้ว</p>
    <button type="button" onclick="window.location.href='/login.html'">เข้าสู่ระบบ</button>
  </div>

</div>

<script>
  const API_BASE = '/auth'; // adjust if the API is hosted elsewhere

  const screens = {
    register: document.getElementById('screen-register'),
    verify: document.getElementById('screen-verify'),
    success: document.getElementById('screen-success'),
  };
  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }
  function showMsg(el, text, type) {
    el.textContent = text;
    el.className = 'msg ' + type;
  }
  function clearMsg(el) {
    el.textContent = '';
    el.className = 'msg';
  }

  let pendingEmail = '';

  // ---- Step 1: register ----
  const registerForm = document.getElementById('register-form');
  const registerMsg = document.getElementById('register-msg');
  const registerSubmit = document.getElementById('register-submit');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg(registerMsg);
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    registerSubmit.disabled = true;
    registerSubmit.textContent = 'กำลังส่ง...';
    try {
      const res = await fetch(`${API_BASE}/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showMsg(registerMsg, data.message || 'ไม่สามารถสมัครสมาชิกได้ กรุณาลองใหม่', 'error');
        return;
      }
      pendingEmail = email;
      document.getElementById('verify-subtitle').textContent = `ส่งรหัสไปที่ ${email} แล้ว`;
      showScreen('verify');
    } catch (err) {
      showMsg(registerMsg, 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่', 'error');
    } finally {
      registerSubmit.disabled = false;
      registerSubmit.textContent = 'ส่งรหัสยืนยัน';
    }
  });

  // ---- Step 2: verify OTP ----
  const verifyForm = document.getElementById('verify-form');
  const verifyMsg = document.getElementById('verify-msg');
  const verifySubmit = document.getElementById('verify-submit');
  const otpInput = document.getElementById('otp-code');

  otpInput.addEventListener('input', () => {
    otpInput.value = otpInput.value.replace(/\D/g, '');
  });

  verifyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg(verifyMsg);
    verifySubmit.disabled = true;
    verifySubmit.textContent = 'กำลังตรวจสอบ...';
    try {
      const res = await fetch(`${API_BASE}/verify-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, otp: otpInput.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        const msg = data.error === 'otp_expired' ? 'รหัสหมดอายุแล้ว กรุณาขอรหัสใหม่'
          : data.error === 'locked' ? data.message
          : data.attemptsRemaining !== undefined ? `รหัสไม่ถูกต้อง (เหลือ ${data.attemptsRemaining} ครั้ง)`
          : 'รหัสไม่ถูกต้อง';
        showMsg(verifyMsg, msg, 'error');
        return;
      }
      showScreen('success');
    } catch (err) {
      showMsg(verifyMsg, 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่', 'error');
    } finally {
      verifySubmit.disabled = false;
      verifySubmit.textContent = 'ยืนยัน';
    }
  });

  // ---- Resend OTP (60s cooldown) ----
  const resendBtn = document.getElementById('resend-btn');
  let cooldown = 0;
  let cooldownTimer = null;

  resendBtn.addEventListener('click', async () => {
    clearMsg(verifyMsg);
    resendBtn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/resend-otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail }),
      });
      const data = await res.json();
      if (!res.ok) {
        showMsg(verifyMsg, data.message || 'ขอรหัสใหม่ไม่สำเร็จ', 'error');
        resendBtn.disabled = false;
        return;
      }
      showMsg(verifyMsg, 'ส่งรหัสใหม่แล้ว', 'info');
      startCooldown(60);
    } catch (err) {
      showMsg(verifyMsg, 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้', 'error');
      resendBtn.disabled = false;
    }
  });

  function startCooldown(seconds) {
    cooldown = seconds;
    resendBtn.disabled = true;
    resendBtn.textContent = `ส่งรหัสอีกครั้งใน ${cooldown} วินาที`;
    cooldownTimer = setInterval(() => {
      cooldown -= 1;
      if (cooldown <= 0) {
        clearInterval(cooldownTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'ส่งรหัสอีกครั้ง';
      } else {
        resendBtn.textContent = `ส่งรหัสอีกครั้งใน ${cooldown} วินาที`;
      }
    }, 1000);
  }
</script>

</body>
</html>
