<!doctype html>
<!-- แม่แบบภาพตัวอย่างลิงก์ (Open Graph) 1200×630 px — ภาพที่ขึ้นตอนแชร์ลิงก์ใน LINE / Facebook / Discord
     แปลงเป็น public/og-image.png ด้วย: node scripts/render-og-image.js -->
<html lang="th">
<head>
<meta charset="utf-8">
<title>OG image</title>
<style>
  @font-face { font-family: "Sarabun"; font-weight: 400; src: url("../../backend/assets/fonts/Sarabun-Regular.ttf"); }
  @font-face { font-family: "Sarabun"; font-weight: 700; src: url("../../backend/assets/fonts/Sarabun-Bold.ttf"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Sarabun", sans-serif;
    background: linear-gradient(135deg, #00514d 0%, #006664 45%, #0b8a7f 100%);
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 80px;
    position: relative;
  }
  /* วงกลมตกแต่งพื้นหลัง */
  body::before, body::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.06);
  }
  body::before { width: 520px; height: 520px; right: -140px; top: -180px; }
  body::after { width: 360px; height: 360px; right: 180px; bottom: -220px; }
  .logo {
    flex: none; width: 340px; height: 340px; border-radius: 48px; background: #fff;
    box-shadow: 0 18px 0 rgba(0, 0, 0, 0.14);
    display: flex; align-items: center; justify-content: center;
  }
  .logo img { width: 300px; height: 300px; }
  .text { color: #fff; position: relative; z-index: 1; }
  .title { font-size: 76px; font-weight: 700; line-height: 1.05; letter-spacing: 1px; }
  .accent { width: 120px; height: 12px; background: #b5bd1f; border-radius: 6px; margin: 22px 0 24px; }
  .tagline { font-size: 40px; font-weight: 700; line-height: 1.3; }
  .sub { font-size: 28px; opacity: 0.85; margin-top: 6px; }
  .chips { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
  .chip {
    font-size: 24px; font-weight: 700; padding: 8px 20px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.16); border: 2px solid rgba(255, 255, 255, 0.28);
  }
  .url { font-size: 26px; margin-top: 30px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="logo"><img src="../src/assets/images/logo.png" alt=""></div>
  <div class="text">
    <div class="title">FOUND&amp;LOST</div>
    <div class="accent"></div>
    <div class="tagline">ระบบแจ้งของหาย - ของพบ</div>
    <div class="sub">มหาวิทยาลัยเกษตรศาสตร์</div>
    <div class="chips">
      <span class="chip">📢 แจ้งของหาย</span>
      <span class="chip">📍 แจ้งพบของ</span>
      <span class="chip">🔔 แจ้งเตือนทาง LINE</span>
    </div>
    <div class="url">app.foundlost.tech</div>
  </div>
</body>
</html>
