# Nginx ของ VPS สำหรับ FOUND&LOST — โดเมนย่อย app.foundlost.tech เท่านั้น
# (ไม่แตะ foundlost.tech / www ซึ่งเป็นโปรเจกต์อื่น)
#
# ติดตั้ง (root):
#   cp deploy/nginx.conf /etc/nginx/sites-available/foundlost.conf
#   ln -s /etc/nginx/sites-available/foundlost.conf /etc/nginx/sites-enabled/foundlost.conf
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d app.foundlost.tech --redirect
# certbot จะเพิ่ม listen 443 + ใบรับรองลงไฟล์นี้เอง — ถ้าแก้ APP_PORT ใน .env ต้องแก้ proxy_pass ให้ตรง

server {
    listen 80;
    listen [::]:80;
    server_name app.foundlost.tech;

    # รูปอัปโหลด ≤ 5 MB ต่อไฟล์ เผื่อข้อมูลฟอร์ม (ตรงกับ Caddyfile)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
