services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    env_file:
      # Keep local credentials in backend/.env. This file is ignored by Git.
      - ./backend/.env

    ports:
      - "5433:5432"

    volumes:
      # Named volume keeps PostgreSQL data after `docker compose down`.
      # Do not run `docker compose down -v` unless the database may be deleted.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped

    env_file:
      # Uses the same local, Git-ignored credentials file as PostgreSQL.
      - ./backend/.env

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  # Docker stores these outside Git. Export a SQL dump to transfer existing data.
  postgres_data:
  pgadmin_data:
