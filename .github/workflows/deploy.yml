name: Deploy

# รันอัตโนมัติเมื่อ CI ผ่านบน main หรือกดเองจากแท็บ Actions (rollback: ใส่ tag เก่า เช่น sha-1a2b3c4)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag ที่จะ deploy (เว้นว่าง = build จาก commit ล่าสุดของ branch ที่เลือก)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    name: Publish images to GHCR
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag == '') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: |
          sha="$(git rev-parse --short=7 HEAD)"
          echo "tag=sha-${sha}" >> "$GITHUB_OUTPUT"
          echo "prefix=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # amd64 = VPS ทั่วไป, arm64 = Oracle Cloud Always Free (Ampere)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: FOUNDLOST/backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.prefix }}/foundlost-backend:latest
            ${{ steps.meta.outputs.prefix }}/foundlost-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: FOUNDLOST
          file: FOUNDLOST/deploy/Dockerfile.web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.prefix }}/foundlost-web:latest
            ${{ steps.meta.outputs.prefix }}/foundlost-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to VPS
    needs: publish
    # publish ถูกข้ามได้ (rollback ด้วย tag เดิม) แต่ต้องไม่ล้มเหลว
    # เปิดใช้เมื่อพร้อม: Settings → Secrets and variables → Actions → Variables → DEPLOY_ENABLED=true
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || needs.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR APP_HEALTH_URL; do
            if [ -z "${!name}" ]; then echo "::error::ยังไม่ได้ตั้ง secret $name"; missing=1; fi
          done
          [ -n "$TAG" ] || { echo "::error::ไม่มี image tag"; missing=1; }
          exit $missing

      - name: Copy compose + scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "FOUNDLOST/compose.deploy.yml,FOUNDLOST/deploy/*.sh,FOUNDLOST/deploy/.env.deploy.example,FOUNDLOST/deploy/backend.env.example"
          target: ${{ secrets.VPS_APP_DIR }}
          strip_components: 1

      - name: Pull + up on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,APP_DIR,TAG
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            # token ของ job นี้หมดอายุเมื่อ job จบ ใช้ดึง image ได้แม้ package เป็น private
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash deploy/deploy.sh "$TAG"
            docker logout ghcr.io

      - name: Health check
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          for i in $(seq 1 24); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$APP_HEALTH_URL" || true)"
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::health check ไม่ตอบ 200 — rollback: กด Run workflow แล้วใส่ tag ก่อนหน้า"
          exit 1
