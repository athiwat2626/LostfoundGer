name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FOUNDLOST/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FOUNDLOST/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: /backend

  backend:
    name: Backend node:test (+ PostgreSQL ชั่วคราว)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FOUNDLOST/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FOUNDLOST/backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # ฐานทดสอบชั่วคราวของ CI เท่านั้น — ไม่ใช่ฐานจริง
          TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
          DB_PASSWORD: ci-only
          JWT_SECRET: ci-only-jwt-secret

  api-tests:
    name: API tests (Jest + Supertest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            FOUNDLOST/backend/package-lock.json
            testcase/backend/package-lock.json
      - run: npm ci
        working-directory: FOUNDLOST/backend
      - run: npm ci
        working-directory: testcase/backend
      # ทุกไฟล์ mock ./db — ไม่ต่อฐานข้อมูล (ค่า env ตั้งใน tests/setupEnv.js)
      - run: npm test -- --ci
        working-directory: testcase/backend

  web-tests:
    name: Web tests (Vitest + RTL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            FOUNDLOST/frontend/package-lock.json
            testcase/frontend/package-lock.json
      - run: npm ci
        working-directory: FOUNDLOST/frontend
      - run: npm ci
        working-directory: testcase/frontend
      - run: npm test
        working-directory: testcase/frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: FOUNDLOST/backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: FOUNDLOST
          file: FOUNDLOST/deploy/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose file valid
        working-directory: FOUNDLOST
        run: |
          cp deploy/.env.deploy.example .env
          cp deploy/backend.env.example backend.env
          docker compose -f compose.deploy.yml config --quiet
